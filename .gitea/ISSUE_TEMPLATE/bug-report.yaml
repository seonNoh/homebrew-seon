name: Bug report
about: Report an installation, upgrade, or repository validation problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please provide reproducible details without credentials or private data.
  - type: input
    id: homebrew-version
    attributes:
      label: Homebrew version
      placeholder: Output of brew --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Intel 64-bit
        - Arm 64-bit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the commands and observed output after removing sensitive values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
