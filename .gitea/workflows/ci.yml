name: Repository CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: https://gitea.com/actions/checkout@v4
      - name: Verify repository contract
        run: python3 verify.py
      - name: Run verifier tests
        run: python3 -m unittest tests/test_verify.py -v
      - name: Check Cask syntax
        run: ruby -c Casks/seon.rb
