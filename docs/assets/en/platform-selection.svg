<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="enps-title enps-desc">
  <title id="enps-title">Platform artifact selection</title>
  <desc id="enps-desc">The Cask maps two operating systems and two architectures to four release artifacts.</desc>
  <style>
    .enps-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.enps-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.enps-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.enps-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}@media (prefers-reduced-motion:reduce){.enps-fl{animation:none}}
  </style>
  <defs>
    <filter id="enps-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="enps-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <linearGradient id="enps-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient>
    <linearGradient id="enps-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient>
    <marker id="enps-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker>
  </defs>
  <rect width="960" height="540" fill="#0d1117"/>
  <text class="enps-t" x="48" y="38" font-size="16" font-weight="600">Platform artifact selection</text><text class="enps-d" x="48" y="58" font-size="11.5">The operating system and CPU architecture select exactly one binary.</text>
  <g filter="url(#enps-shl)"><rect x="288" y="96" width="384" height="78" rx="12" fill="url(#enps-sl)" stroke="#33404f"/><path d="M300 97H660" stroke="#7c9fff" stroke-opacity=".4"/><text class="enps-t" x="320" y="128" font-size="13" font-weight="500">Cask selector</text><text class="enps-m" x="320" y="151" font-size="10.5">OS + architecture → release artifact</text></g>
  <text class="enps-d" x="64" y="214" font-size="11">macOS</text><text class="enps-d" x="64" y="342" font-size="11">Linux</text><text class="enps-d" x="272" y="198" font-size="11">Intel 64-bit</text><text class="enps-d" x="608" y="198" font-size="11">Arm 64-bit</text>
  <g filter="url(#enps-sh)"><rect x="216" y="224" width="288" height="96" rx="12" fill="url(#enps-s)" stroke="#252d38"/><text class="enps-b" x="240" y="258" font-size="13" font-weight="500">macOS on Intel</text><rect x="240" y="274" width="240" height="28" rx="8" fill="#1e2530"/><text class="enps-m" x="252" y="293" font-size="10.5">seon-darwin-amd64</text></g>
  <g filter="url(#enps-sh)"><rect x="552" y="224" width="288" height="96" rx="12" fill="url(#enps-s)" stroke="#252d38"/><text class="enps-b" x="576" y="258" font-size="13" font-weight="500">macOS on Apple silicon</text><rect x="576" y="274" width="240" height="28" rx="8" fill="#1e2530"/><text class="enps-m" x="588" y="293" font-size="10.5">seon-darwin-arm64</text></g>
  <g filter="url(#enps-sh)"><rect x="216" y="352" width="288" height="96" rx="12" fill="url(#enps-s)" stroke="#252d38"/><text class="enps-b" x="240" y="386" font-size="13" font-weight="500">Linux on Intel</text><rect x="240" y="402" width="240" height="28" rx="8" fill="#1e2530"/><text class="enps-m" x="252" y="421" font-size="10.5">seon-linux-amd64</text></g>
  <g filter="url(#enps-sh)"><rect x="552" y="352" width="288" height="96" rx="12" fill="url(#enps-s)" stroke="#252d38"/><text class="enps-b" x="576" y="386" font-size="13" font-weight="500">Linux on Arm</text><rect x="576" y="402" width="240" height="28" rx="8" fill="#1e2530"/><text class="enps-m" x="588" y="421" font-size="10.5">seon-linux-arm64</text></g>
  <text class="enps-d" x="48" y="492" font-size="11">Source: platform blocks in Casks/seon.rb</text>
</svg>
