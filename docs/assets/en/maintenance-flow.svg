<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="enmf-title enmf-desc">
  <title id="enmf-title">Tap maintenance flow</title><desc id="enmf-desc">The upstream release pipeline generates the Cask, repository checks validate it, and Gitea stores the reviewed source.</desc>
  <style>.enmf-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.enmf-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.enmf-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.enmf-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.enmf-fl{stroke-dasharray:5 6;animation:enmf-flow 2s linear infinite}@keyframes enmf-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.enmf-fl{animation:none}}</style>
  <defs><filter id="enmf-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="enmf-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="enmf-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="enmf-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="enmf-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="enmf-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="enmf-t" x="48" y="38" font-size="16" font-weight="600">Tap maintenance flow</text><text class="enmf-d" x="48" y="58" font-size="11.5">Generated release metadata is validated before the reviewed source is pushed to Gitea.</text>
  <g filter="url(#enmf-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#enmf-s)" stroke="#252d38"/><text class="enmf-b" x="66" y="194" font-size="13" font-weight="500">Seon CLI release</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="enmf-d" x="80" y="242" font-size="11">Builds four binaries</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="enmf-m" x="80" y="292" font-size="10.5">GoReleaser</text><text class="enmf-m" x="80" y="308" font-size="10.5">version + URL + SHA-256</text></g>
  <g filter="url(#enmf-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#enmf-sl)" stroke="#33404f"/><text class="enmf-t" x="370" y="174" font-size="13" font-weight="500">Generated Cask</text><rect x="370" y="200" width="220" height="34" rx="8" fill="#232c39"/><text class="enmf-m" x="384" y="222" font-size="10.5">Casks/seon.rb</text><rect x="370" y="250" width="220" height="34" rx="8" fill="#232c39"/><text class="enmf-d" x="384" y="272" font-size="11">Repository contract checks</text><rect x="370" y="300" width="220" height="42" rx="9" fill="#232c39" filter="url(#enmf-gl)"/><text class="enmf-t" x="384" y="326" font-size="11">Reviewed change</text></g>
  <g filter="url(#enmf-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#enmf-s)" stroke="#252d38"/><text class="enmf-b" x="706" y="194" font-size="13" font-weight="500">Gitea repository</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="enmf-d" x="720" y="242" font-size="11">Source of truth</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="enmf-m" x="720" y="292" font-size="10.5">main branch</text><text class="enmf-m" x="720" y="308" font-size="10.5">Gitea-native CI</text></g>
  <path class="enmf-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#enmf-t)"/><path class="enmf-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#enmf-t)"/><text class="enmf-d" x="48" y="482" font-size="11">Policy: generated Cask metadata is never edited by hand.</text>
</svg>
