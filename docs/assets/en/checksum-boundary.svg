<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="encb-title encb-desc">
  <title id="encb-title">SHA-256 integrity boundary</title><desc id="encb-desc">Homebrew compares the downloaded binary digest with the Cask digest before installation.</desc>
  <style>.encb-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.encb-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.encb-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.encb-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.encb-fl{stroke-dasharray:5 6;animation:encb-flow 2s linear infinite}@keyframes encb-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.encb-fl{animation:none}}</style>
  <defs><filter id="encb-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="encb-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="encb-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="encb-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="encb-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="encb-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="encb-t" x="48" y="38" font-size="16" font-weight="600">SHA-256 integrity boundary</text><text class="encb-d" x="48" y="58" font-size="11.5">Installation continues only when the downloaded artifact matches the pinned digest.</text>
  <g filter="url(#encb-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#encb-s)" stroke="#252d38"/><text class="encb-b" x="66" y="194" font-size="13" font-weight="500">Release artifact</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="encb-d" x="80" y="242" font-size="11">Downloaded over HTTPS</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="encb-m" x="80" y="292" font-size="10.5">platform binary</text><text class="encb-m" x="80" y="308" font-size="10.5">computed SHA-256</text></g>
  <g filter="url(#encb-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#encb-sl)" stroke="#33404f"/><text class="encb-t" x="370" y="174" font-size="13" font-weight="500">Homebrew verification</text><rect x="370" y="200" width="220" height="50" rx="8" fill="#232c39"/><text class="encb-m" x="384" y="222" font-size="10.5">computed digest</text><text class="encb-m" x="384" y="238" font-size="10.5">pinned Cask digest</text><rect x="370" y="270" width="220" height="42" rx="9" fill="#232c39" filter="url(#encb-gl)"/><text class="encb-t" x="384" y="296" font-size="11">Exact match required</text><text class="encb-d" x="370" y="342" font-size="11">Mismatch stops installation</text></g>
  <g filter="url(#encb-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#encb-s)" stroke="#252d38"/><text class="encb-b" x="706" y="194" font-size="13" font-weight="500">Installed command</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="encb-d" x="720" y="242" font-size="11">Verified binary only</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="encb-m" x="720" y="292" font-size="10.5">target: seon</text><text class="encb-m" x="720" y="308" font-size="10.5">managed by brew</text></g>
  <path class="encb-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#encb-t)"/><path class="encb-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#encb-t)"/><text class="encb-d" x="48" y="482" font-size="11">Source: sha256 stanzas in Casks/seon.rb</text>
</svg>
