<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="jamf-title jamf-desc">
  <title id="jamf-title">Homebrew Tap のメンテナンスフロー</title><desc id="jamf-desc">上流のリリースパイプラインが Cask を生成し、リポジトリ検証を経て Gitea に反映します。</desc>
  <style>.jamf-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.jamf-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.jamf-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.jamf-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.jamf-fl{stroke-dasharray:5 6;animation:jamf-flow 2s linear infinite}@keyframes jamf-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.jamf-fl{animation:none}}</style>
  <defs><filter id="jamf-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="jamf-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="jamf-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="jamf-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="jamf-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="jamf-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="jamf-t" x="48" y="38" font-size="16" font-weight="600">Homebrew Tap のメンテナンスフロー</text><text class="jamf-d" x="48" y="58" font-size="11.5">生成したリリースメタデータを検証し、レビュー済みのソースを Gitea に反映します。</text>
  <g filter="url(#jamf-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#jamf-s)" stroke="#252d38"/><text class="jamf-b" x="66" y="194" font-size="13">Seon CLI リリース</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="jamf-d" x="80" y="242" font-size="11">四つのバイナリをビルド</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="jamf-m" x="80" y="292" font-size="10.5">GoReleaser</text><text class="jamf-m" x="80" y="308" font-size="10.5">バージョン + URL + SHA-256</text></g>
  <g filter="url(#jamf-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#jamf-sl)" stroke="#33404f"/><text class="jamf-t" x="370" y="174" font-size="13">生成済み Cask</text><rect x="370" y="200" width="220" height="34" rx="8" fill="#232c39"/><text class="jamf-m" x="384" y="222" font-size="10.5">Casks/seon.rb</text><rect x="370" y="250" width="220" height="34" rx="8" fill="#232c39"/><text class="jamf-d" x="384" y="272" font-size="11">リポジトリ契約を検証</text><rect x="370" y="300" width="220" height="42" rx="9" fill="#232c39" filter="url(#jamf-gl)"/><text class="jamf-t" x="384" y="326" font-size="11">レビュー済みの変更</text></g>
  <g filter="url(#jamf-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#jamf-s)" stroke="#252d38"/><text class="jamf-b" x="706" y="194" font-size="13">Gitea リポジトリ</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="jamf-d" x="720" y="242" font-size="11">作業の基準ソース</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="jamf-m" x="720" y="292" font-size="10.5">main ブランチ</text><text class="jamf-m" x="720" y="308" font-size="10.5">Gitea 専用 CI</text></g>
  <path class="jamf-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#jamf-t)"/><path class="jamf-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#jamf-t)"/><text class="jamf-d" x="48" y="482" font-size="11">方針: 生成された Cask メタデータは手作業で変更しません。</text>
</svg>
