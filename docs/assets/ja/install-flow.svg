<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="jaif-title jaif-desc">
  <title id="jaif-title">Seon のインストールフロー</title><desc id="jaif-desc">Homebrew が Tap を確認し、プラットフォーム別の成果物を検証して Seon コマンドをインストールします。</desc>
  <style>.jaif-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.jaif-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.jaif-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.jaif-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.jaif-fl{stroke-dasharray:5 6;animation:jaif-flow 2s linear infinite}@keyframes jaif-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.jaif-fl{animation:none}}</style>
  <defs><filter id="jaif-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="jaif-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="jaif-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="jaif-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="jaif-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="jaif-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="jaif-t" x="48" y="38" font-size="16" font-weight="600">Seon のインストールフロー</text><text class="jaif-d" x="48" y="58" font-size="11.5">プラットフォームに合うバイナリを一つ選び、検証して seon コマンドとしてリンクします。</text>
  <g filter="url(#jaif-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#jaif-s)" stroke="#252d38"/><text class="jaif-b" x="66" y="194" font-size="13">ターミナル</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="jaif-m" x="80" y="242" font-size="10.5">brew tap seonNoh/seon</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="jaif-m" x="80" y="292" font-size="10.5">brew install --cask</text><text class="jaif-m" x="80" y="308" font-size="10.5">seonNoh/seon/seon</text></g>
  <g filter="url(#jaif-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#jaif-sl)" stroke="#33404f"/><text class="jaif-t" x="370" y="174" font-size="13">Homebrew Cask</text><rect x="370" y="200" width="220" height="34" rx="8" fill="#232c39"/><text class="jaif-d" x="384" y="222" font-size="11">OS とアーキテクチャを判定</text><rect x="370" y="250" width="220" height="34" rx="8" fill="#232c39"/><text class="jaif-d" x="384" y="272" font-size="11">固定した SHA-256 を検証</text><rect x="370" y="300" width="220" height="42" rx="9" fill="#232c39" filter="url(#jaif-gl)"/><text class="jaif-t" x="384" y="326" font-size="11">選択したバイナリをリンク</text></g>
  <g filter="url(#jaif-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#jaif-s)" stroke="#252d38"/><text class="jaif-b" x="706" y="194" font-size="13">インストール済みコマンド</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="jaif-m" x="720" y="242" font-size="10.5">seon --version</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="jaif-d" x="720" y="292" font-size="11">Homebrew が管理する</text><text class="jaif-d" x="720" y="308" font-size="11">インストール先</text></g>
  <path class="jaif-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#jaif-t)"/><path class="jaif-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#jaif-t)"/><text class="jaif-d" x="48" y="482" font-size="11">出典: Casks/seon.rb</text>
</svg>
