<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="jacb-title jacb-desc">
  <title id="jacb-title">SHA-256 による整合性検証</title><desc id="jacb-desc">Homebrew がインストール前に、ダウンロードしたバイナリと Cask のハッシュを照合します。</desc>
  <style>.jacb-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.jacb-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.jacb-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.jacb-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.jacb-fl{stroke-dasharray:5 6;animation:jacb-flow 2s linear infinite}@keyframes jacb-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.jacb-fl{animation:none}}</style>
  <defs><filter id="jacb-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="jacb-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="jacb-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="jacb-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="jacb-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="jacb-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="jacb-t" x="48" y="38" font-size="16" font-weight="600">SHA-256 による整合性検証</text><text class="jacb-d" x="48" y="58" font-size="11.5">ダウンロードした成果物と固定済みハッシュが一致した場合だけ、インストールを続行します。</text>
  <g filter="url(#jacb-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#jacb-s)" stroke="#252d38"/><text class="jacb-b" x="66" y="194" font-size="13">リリース成果物</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="jacb-d" x="80" y="242" font-size="11">HTTPS でダウンロード</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="jacb-m" x="80" y="292" font-size="10.5">プラットフォームバイナリ</text><text class="jacb-m" x="80" y="308" font-size="10.5">計算した SHA-256</text></g>
  <g filter="url(#jacb-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#jacb-sl)" stroke="#33404f"/><text class="jacb-t" x="370" y="174" font-size="13">Homebrew の検証</text><rect x="370" y="200" width="220" height="50" rx="8" fill="#232c39"/><text class="jacb-m" x="384" y="222" font-size="10.5">計算したハッシュ</text><text class="jacb-m" x="384" y="238" font-size="10.5">Cask に固定したハッシュ</text><rect x="370" y="270" width="220" height="42" rx="9" fill="#232c39" filter="url(#jacb-gl)"/><text class="jacb-t" x="384" y="296" font-size="11">完全一致が必須</text><text class="jacb-d" x="370" y="342" font-size="11">不一致ならインストールを中止</text></g>
  <g filter="url(#jacb-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#jacb-s)" stroke="#252d38"/><text class="jacb-b" x="706" y="194" font-size="13">インストール済みコマンド</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="jacb-d" x="720" y="242" font-size="11">検証済みバイナリだけ許可</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="jacb-m" x="720" y="292" font-size="10.5">target: seon</text><text class="jacb-m" x="720" y="308" font-size="10.5">brew が管理</text></g>
  <path class="jacb-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#jacb-t)"/><path class="jacb-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#jacb-t)"/><text class="jacb-d" x="48" y="482" font-size="11">出典: Casks/seon.rb の sha256 スタンザ</text>
</svg>
