<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="koif-title koif-desc">
  <title id="koif-title">Seon 설치 흐름</title><desc id="koif-desc">Homebrew가 탭을 확인하고 플랫폼별 산출물을 검증한 뒤 Seon 명령을 설치하는 과정입니다.</desc>
  <style>.koif-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.koif-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.koif-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.koif-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.koif-fl{stroke-dasharray:5 6;animation:koif-flow 2s linear infinite}@keyframes koif-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.koif-fl{animation:none}}</style>
  <defs><filter id="koif-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="koif-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="koif-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="koif-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="koif-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="koif-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="koif-t" x="48" y="38" font-size="16" font-weight="600">Seon 설치 흐름</text><text class="koif-d" x="48" y="58" font-size="11.5">플랫폼에 맞는 바이너리 하나를 선택하고 검증하여 seon 명령으로 연결합니다.</text>
  <g filter="url(#koif-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#koif-s)" stroke="#252d38"/><text class="koif-b" x="66" y="194" font-size="13" font-weight="500">터미널</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="koif-m" x="80" y="242" font-size="10.5">brew tap seonNoh/seon</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="koif-m" x="80" y="292" font-size="10.5">brew install --cask</text><text class="koif-m" x="80" y="308" font-size="10.5">seonNoh/seon/seon</text></g>
  <g filter="url(#koif-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#koif-sl)" stroke="#33404f"/><text class="koif-t" x="370" y="174" font-size="13" font-weight="500">Homebrew Cask</text><rect x="370" y="200" width="220" height="34" rx="8" fill="#232c39"/><text class="koif-d" x="384" y="222" font-size="11">운영체제와 아키텍처 감지</text><rect x="370" y="250" width="220" height="34" rx="8" fill="#232c39"/><text class="koif-d" x="384" y="272" font-size="11">고정된 SHA-256 검증</text><rect x="370" y="300" width="220" height="42" rx="9" fill="#232c39" filter="url(#koif-gl)"/><text class="koif-t" x="384" y="326" font-size="11">선택한 바이너리 연결</text></g>
  <g filter="url(#koif-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#koif-s)" stroke="#252d38"/><text class="koif-b" x="706" y="194" font-size="13" font-weight="500">설치된 명령</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="koif-m" x="720" y="242" font-size="10.5">seon --version</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="koif-d" x="720" y="292" font-size="11">Homebrew가 관리하는</text><text class="koif-d" x="720" y="308" font-size="11">설치 경로</text></g>
  <path class="koif-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#koif-t)"/><path class="koif-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#koif-t)"/><text class="koif-d" x="48" y="482" font-size="11">출처: Casks/seon.rb</text>
</svg>
