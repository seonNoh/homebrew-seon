<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="kocb-title kocb-desc">
  <title id="kocb-title">SHA-256 무결성 검증 경계</title><desc id="kocb-desc">Homebrew가 설치 전에 내려받은 바이너리의 해시와 Cask의 해시를 대조합니다.</desc>
  <style>.kocb-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.kocb-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.kocb-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.kocb-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.kocb-fl{stroke-dasharray:5 6;animation:kocb-flow 2s linear infinite}@keyframes kocb-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.kocb-fl{animation:none}}</style>
  <defs><filter id="kocb-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="kocb-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="kocb-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="kocb-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="kocb-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="kocb-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="kocb-t" x="48" y="38" font-size="16" font-weight="600">SHA-256 무결성 검증 경계</text><text class="kocb-d" x="48" y="58" font-size="11.5">내려받은 산출물과 고정된 해시가 일치할 때만 설치를 계속합니다.</text>
  <g filter="url(#kocb-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#kocb-s)" stroke="#252d38"/><text class="kocb-b" x="66" y="194" font-size="13">릴리스 산출물</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="kocb-d" x="80" y="242" font-size="11">HTTPS로 내려받음</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="kocb-m" x="80" y="292" font-size="10.5">플랫폼 바이너리</text><text class="kocb-m" x="80" y="308" font-size="10.5">계산된 SHA-256</text></g>
  <g filter="url(#kocb-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#kocb-sl)" stroke="#33404f"/><text class="kocb-t" x="370" y="174" font-size="13">Homebrew 검증</text><rect x="370" y="200" width="220" height="50" rx="8" fill="#232c39"/><text class="kocb-m" x="384" y="222" font-size="10.5">계산된 해시</text><text class="kocb-m" x="384" y="238" font-size="10.5">Cask에 고정된 해시</text><rect x="370" y="270" width="220" height="42" rx="9" fill="#232c39" filter="url(#kocb-gl)"/><text class="kocb-t" x="384" y="296" font-size="11">완전 일치 필수</text><text class="kocb-d" x="370" y="342" font-size="11">불일치하면 설치 중단</text></g>
  <g filter="url(#kocb-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#kocb-s)" stroke="#252d38"/><text class="kocb-b" x="706" y="194" font-size="13">설치된 명령</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="kocb-d" x="720" y="242" font-size="11">검증된 바이너리만 허용</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="kocb-m" x="720" y="292" font-size="10.5">target: seon</text><text class="kocb-m" x="720" y="308" font-size="10.5">brew 관리</text></g>
  <path class="kocb-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#kocb-t)"/><path class="kocb-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#kocb-t)"/><text class="kocb-d" x="48" y="482" font-size="11">출처: Casks/seon.rb의 sha256 항목</text>
</svg>
