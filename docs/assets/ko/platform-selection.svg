<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="kops-title kops-desc">
  <title id="kops-title">플랫폼 산출물 선택</title><desc id="kops-desc">Cask가 두 운영체제와 두 아키텍처를 네 가지 릴리스 산출물에 연결합니다.</desc>
  <style>.kops-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.kops-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.kops-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.kops-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}@media (prefers-reduced-motion:reduce){.kops-fl{animation:none}}</style>
  <defs><filter id="kops-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="kops-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><linearGradient id="kops-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="kops-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="kops-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="kops-t" x="48" y="38" font-size="16" font-weight="600">플랫폼 산출물 선택</text><text class="kops-d" x="48" y="58" font-size="11.5">운영체제와 CPU 아키텍처 조합에 따라 바이너리 하나를 선택합니다.</text>
  <g filter="url(#kops-shl)"><rect x="288" y="96" width="384" height="78" rx="12" fill="url(#kops-sl)" stroke="#33404f"/><text class="kops-t" x="320" y="128" font-size="13" font-weight="500">Cask 선택기</text><text class="kops-m" x="320" y="151" font-size="10.5">운영체제 + 아키텍처 → 릴리스 산출물</text></g>
  <text class="kops-d" x="64" y="214" font-size="11">macOS</text><text class="kops-d" x="64" y="342" font-size="11">Linux</text><text class="kops-d" x="272" y="198" font-size="11">Intel 64비트</text><text class="kops-d" x="608" y="198" font-size="11">Arm 64비트</text>
  <g filter="url(#kops-sh)"><rect x="216" y="224" width="288" height="96" rx="12" fill="url(#kops-s)" stroke="#252d38"/><text class="kops-b" x="240" y="258" font-size="13">macOS Intel</text><rect x="240" y="274" width="240" height="28" rx="8" fill="#1e2530"/><text class="kops-m" x="252" y="293" font-size="10.5">seon-darwin-amd64</text></g><g filter="url(#kops-sh)"><rect x="552" y="224" width="288" height="96" rx="12" fill="url(#kops-s)" stroke="#252d38"/><text class="kops-b" x="576" y="258" font-size="13">macOS Apple silicon</text><rect x="576" y="274" width="240" height="28" rx="8" fill="#1e2530"/><text class="kops-m" x="588" y="293" font-size="10.5">seon-darwin-arm64</text></g><g filter="url(#kops-sh)"><rect x="216" y="352" width="288" height="96" rx="12" fill="url(#kops-s)" stroke="#252d38"/><text class="kops-b" x="240" y="386" font-size="13">Linux Intel</text><rect x="240" y="402" width="240" height="28" rx="8" fill="#1e2530"/><text class="kops-m" x="252" y="421" font-size="10.5">seon-linux-amd64</text></g><g filter="url(#kops-sh)"><rect x="552" y="352" width="288" height="96" rx="12" fill="url(#kops-s)" stroke="#252d38"/><text class="kops-b" x="576" y="386" font-size="13">Linux Arm</text><rect x="576" y="402" width="240" height="28" rx="8" fill="#1e2530"/><text class="kops-m" x="588" y="421" font-size="10.5">seon-linux-arm64</text></g>
  <text class="kops-d" x="48" y="492" font-size="11">출처: Casks/seon.rb의 플랫폼 블록</text>
