<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="komf-title komf-desc">
  <title id="komf-title">Homebrew 탭 유지보수 흐름</title><desc id="komf-desc">상위 릴리스 파이프라인이 Cask를 생성하고 저장소 검증을 거쳐 Gitea에 반영합니다.</desc>
  <style>.komf-t{font-family:"Pretendard",system-ui,sans-serif;fill:#f0f6fc}.komf-b{font-family:"Pretendard",system-ui,sans-serif;fill:#c3ccd6}.komf-d{font-family:"Pretendard",system-ui,sans-serif;fill:#939da8}.komf-m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#939da8}.komf-fl{stroke-dasharray:5 6;animation:komf-flow 2s linear infinite}@keyframes komf-flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.komf-fl{animation:none}}</style>
  <defs><filter id="komf-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="komf-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><filter id="komf-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter><linearGradient id="komf-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="komf-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="komf-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="komf-t" x="48" y="38" font-size="16" font-weight="600">Homebrew 탭 유지보수 흐름</text><text class="komf-d" x="48" y="58" font-size="11.5">생성된 릴리스 메타데이터를 검증한 뒤 Gitea의 검토된 소스로 반영합니다.</text>
  <g filter="url(#komf-sh)"><rect x="48" y="160" width="224" height="190" rx="12" fill="url(#komf-s)" stroke="#252d38"/><text class="komf-b" x="66" y="194" font-size="13">Seon CLI 릴리스</text><rect x="66" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="komf-d" x="80" y="242" font-size="11">바이너리 네 개 빌드</text><rect x="66" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="komf-m" x="80" y="292" font-size="10.5">GoReleaser</text><text class="komf-m" x="80" y="308" font-size="10.5">버전 + URL + SHA-256</text></g>
  <g filter="url(#komf-shl)"><rect x="352" y="136" width="256" height="238" rx="12" fill="url(#komf-sl)" stroke="#33404f"/><text class="komf-t" x="370" y="174" font-size="13">생성된 Cask</text><rect x="370" y="200" width="220" height="34" rx="8" fill="#232c39"/><text class="komf-m" x="384" y="222" font-size="10.5">Casks/seon.rb</text><rect x="370" y="250" width="220" height="34" rx="8" fill="#232c39"/><text class="komf-d" x="384" y="272" font-size="11">저장소 계약 검사</text><rect x="370" y="300" width="220" height="42" rx="9" fill="#232c39" filter="url(#komf-gl)"/><text class="komf-t" x="384" y="326" font-size="11">검토된 변경</text></g>
  <g filter="url(#komf-sh)"><rect x="688" y="160" width="224" height="190" rx="12" fill="url(#komf-s)" stroke="#252d38"/><text class="komf-b" x="706" y="194" font-size="13">Gitea 저장소</text><rect x="706" y="220" width="188" height="34" rx="8" fill="#1e2530"/><text class="komf-d" x="720" y="242" font-size="11">작업 원본</text><rect x="706" y="270" width="188" height="52" rx="8" fill="#1e2530"/><text class="komf-m" x="720" y="292" font-size="10.5">main 브랜치</text><text class="komf-m" x="720" y="308" font-size="10.5">Gitea 전용 CI</text></g>
  <path class="komf-fl" d="M272 255H344" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#komf-t)"/><path class="komf-fl" d="M608 255H680" fill="none" stroke="#7c9fff" stroke-width="1.6" marker-end="url(#komf-t)"/><text class="komf-d" x="48" y="482" font-size="11">정책: 생성된 Cask 메타데이터는 수동으로 수정하지 않습니다.</text>
</svg>
